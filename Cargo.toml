[package]
name = "just-notify-server"
version = "0.1.0"
edition = "2021"
description = "IPFS-compatible libp2p server daemon with UDS IPC and CLI control client"

[dependencies]
libp2p = { version = "0.56", features = [
    "tcp",
    "quic",
    "dns",
    "noise",
    "yamux",
    "kad",
    "identify",
    "ping",
    "autonat",
    "tokio",
    "macros",
] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
cid = "0.11"
multihash = "0.19"
sha2 = "0.11"
anyhow = "1.0"
futures = "0.3"
